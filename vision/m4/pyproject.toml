[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m4"
version = "0.1.0"
description = "M4 training infrastructure for vision-language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.2",
    "torchvision",
    "transformers>=4.47.1",
    "datasets>=2.0.0",
    "peft>=0.2.0",
    "deepspeed>=0.13.5",
    "safetensors>=0.2.0",
    "bitsandbytes>=0.37.0",
    "accelerate>=0.33.0",
    "wandb",
    "rich",
    "numpy>=1.21.0",
    "opencv-python",
    "decord",
    "liger-kernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["m4*"]
