# Vietnamese SmolVLM Stage 1 Training Config (1 GPU - 24GB)
# Optimized for single GPU with 24GB VRAM
#
# Launch with the companion accelerate config (which carries the DeepSpeed
# ZeRO-2 / bf16 settings — m4's Parameters schema has no deepspeed section):
#   accelerate launch --config_file accelerate_config_1gpu.yaml \
#       -m m4.training.main --config config_stage1_1gpu.yaml
#
# Note: data_param entries must use m4's fixed dataset field names
# (laion_coco, vqav2_task_finetuning, ocr, ...). Each webdataset entry takes a
# single .txt file listing one shard path per line.

data_param:
    # Vietnamese Captioning (UIT-ViIC) — image-caption pairs
    laion_coco:
        dataset_name: LAION_COCO
        training_datasets_paths:
        - data/webdataset/vietnamese_caption/shards.txt
        add_begin_of_doc_token: True
        add_end_of_doc_token: True
        map_batch_size: 16
        max_num_images: 2
        max_seq_len: 512
        pad_dataset: True
        shuffle_initial_urls_list: True
        shuffle_before_split_by_node_buffer_size: 200
        shuffle_before_split_by_worker_buffer_size: 200
        shuffle_after_tarfile_to_samples_buffer_size: 400
        shuffle_after_packing: True
        max_image_size: 336  # Siglip default, memory efficient
        scale_up_max: 1.0
        scale_up_frequency: 0.0
        pre_split_scale_up_max: 1.0
        pre_split_scale_up_frequency: 1.0

    # The Cauldron - VQAv2 subset only
    vqav2_task_finetuning:
        dataset_name: VQAV2_TASK_FINETUNING
        training_datasets_paths:
        - data/webdataset/vqav2/shards.txt
        add_begin_of_doc_token: True
        add_end_of_doc_token: True
        map_batch_size: 16
        max_num_images: 2
        max_seq_len: 512  # Further reduced for single GPU
        pad_dataset: True
        shuffle_initial_urls_list: True
        shuffle_before_split_by_node_buffer_size: 300
        shuffle_before_split_by_worker_buffer_size: 300
        shuffle_after_tarfile_to_samples_buffer_size: 500
        shuffle_after_packing: True
        max_image_size: 336
        scale_up_max: 1.0
        scale_up_frequency: 0.0
        pre_split_scale_up_max: 1.0
        pre_split_scale_up_frequency: 1.0

    # Vietnamese OCR (ViOCRVQA)
    ocr:
        dataset_name: OCR
        training_datasets_paths:
        - data/webdataset/vietnamese_ocr/shards.txt
        add_begin_of_doc_token: True
        add_end_of_doc_token: True
        map_batch_size: 16
        max_num_images: 2
        max_seq_len: 512
        pad_dataset: True
        shuffle_initial_urls_list: True
        shuffle_before_split_by_node_buffer_size: 200
        shuffle_before_split_by_worker_buffer_size: 200
        shuffle_after_tarfile_to_samples_buffer_size: 400
        shuffle_after_packing: True
        max_image_size: 336
        scale_up_max: 1.0
        scale_up_frequency: 0.0
        pre_split_scale_up_max: 1.0
        pre_split_scale_up_frequency: 1.0

    num_workers: 1
    realtime_processing: True
    persistent_workers: False
    pin_memory: False  # Disable to save CPU memory
    # Mixture: 50% Cauldron VQAv2, 25% Vi OCR, 25% Vi Caption.
    # Order follows DatasetNames enum order of the active datasets:
    # laion_coco (Vi caption), vqav2_task_finetuning (Cauldron), ocr (Vi OCR)
    proba_interleaving_dataset: [0.25, 0.50, 0.25]
    use_webdataset: True

hparams:
    # Vietnamese tokenizer expanded from the SmolVLM tokenizer (see
    # vision/scripts/tokenizer/expand_tokenizer.py). Expand from
    # HuggingFaceTB/SmolVLM-500M-Instruct so <image> keeps id 49190.
    tokenizer_name: /data/mikke/Repository/smollm/data/vietnamese_tokenizer
    tokenizer_params: '{"use_fast": True}'
    tokenizer_add_tokens: '[]'
    tokenizer_add_special_tokens: '{}'
    model_name: HuggingFaceTB/SmolVLM-500M-Instruct
    model_config:
        vision_config:
            vision_model_name: google/siglip-base-patch16-512
        _flash_attn_2_enabled: True  # Flash attn saves significant memory
        tie_word_embeddings: False
        freeze_lm_head: True
        freeze_text_layers: True
        freeze_vision_layers: True
        use_resampler: False
        qk_layer_norms: False
        use_cache: True
        neftune_noise_alpha: 0.0
        image_token_id: 49190  # must equal tokenizer.convert_tokens_to_ids("<image>")
    lora_config:
        lora_alpha: 16
        lora_dropout: 0.1
        r: 16  # Even smaller LoRA rank for memory
        bias: "none"
        init_lora_weights: "gaussian"
        use_dora: True
    use_lora: True
    patterns_to_loraify: [
        ["vision", "encoder", "q_proj"],
        ["vision", "encoder", "v_proj"],
        ["model.layers", "q_proj"],
        ["model.layers", "v_proj"],
        ["lm_head"],
    ]
    patterns_to_unfreeze: [["modality"], ["vision", "embed"], ["model", "embed_tokens"]]
    # grad_acc_size is derived by the trainer:
    # global_batch_size / (batch_size_per_gpu * num_processes) = 8 / (2 * 1) = 4
    global_batch_size: 8
    batch_size_per_gpu: 2  # Small batch for 24GB
    gradient_checkpointing: True
    grad_clip: 1.0
    max_num_opt_steps: 5_000  # ~2-3 hours on single GPU
    seed: 42
    train_logging_activations:
    - jsonl
    train_logging_activations_opt_steps: 25
    train_logging_grad_param_deepspeed:
    - jsonl
    train_logging_grad_param_deepspeed_opt_steps: 25
    train_logging_opt_steps: 5
    train_saving_opt_steps: 500
    val_logging_opt_steps: 500
    do_validation: False
    wandb_enable: true
    wandb_entity: huggingfacem4
    wandb_log_freq: 25
    wandb_project: VLOOM_VIETNAMESE_1GPU
    upload_to_s3: False
    timing_break_down: True

optim_param:
    vl_optim: AdamW
    vl_optim_params:
        betas: [0.9, 0.999]
        lr: 0.0001
        weight_decay: 0.1
        no_decay: ["bias", "alpha", "layernorm", "ln", "perceiver_resampler", "layer_norm"]
    vl_lr_scheduler: get_linear_schedule_with_warmup
    vl_lr_scheduler_params:
        last_epoch: -1
        num_warmup_steps: 100
        num_training_steps: 10_000
    z_loss: 0
